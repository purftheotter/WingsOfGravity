[package]
name = "Wings_Of_Gravity"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl2 = {version = '*', features = ["image","ttf","gfx"]}
rapier2d = { version = "*", features = [ "simd-stable", "serde-serialize"] }
rand = "*"
noise = "*"
serde = {version = '1', features = ["derive"]}
ron = "0.8"
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
pollster = "0.3"
bytemuck = { version = "1.24", features = [ "derive" ] }

[dependencies.image]
version = "0.24"
default-fetures = false
features = ["png", "jpeg"]

